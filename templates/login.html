<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Billing POS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           DESIGN TOKENS (shared across all pages)
        ===================================================== */
        :root {
            --bg: #F5F6F3;
            --surface: #FFFFFF;
            --surface-sunken: #EFF1EC;
            --border: #E1E3DE;
            --text: #1A1D1B;
            --text-muted: #6B7268;

            --accent: #1F6F54;
            --accent-hover: #185B44;
            --accent-soft: #E4EFE9;
            --danger: #B3392C;
            --danger-soft: #F6E4E1;

            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

            --radius: 8px;
            --shadow: 0 20px 50px rgba(15, 23, 20, 0.18);

            --stage-a: #14211C;
            --stage-b: #0E1613;
        }

        [data-theme="dark"] {
            --bg: #0D1013;
            --surface: #1B2127;
            --surface-sunken: #161B20;
            --border: #2A3138;
            --text: #E8EAE7;
            --text-muted: #8B948C;

            --accent: #2E8F6E;
            --accent-hover: #37A67F;
            --accent-soft: #16261F;
            --danger: #C4564A;
            --danger-soft: #2A1917;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

            --stage-a: #05080A;
            --stage-b: #0B0F10;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-ui);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 20% 15%, var(--stage-a), var(--stage-b) 65%);
            transition: background 0.15s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            padding: 34px 30px 18px 30px;
        }

        .login-mark {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px auto;
        }

        .login-header h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
        }

        .login-header p {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0;
        }

        .login-body { padding: 8px 30px 30px 30px; }

        .alert-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: var(--radius);
            padding: 11px 14px;
            font-size: 13.5px;
            margin-bottom: 18px;
        }

        .field-group { margin-bottom: 16px; }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field {
            width: 100%;
            padding: 12px 14px;
            font-size: 14.5px;
            font-family: var(--font-ui);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunken);
            color: var(--text);
        }

        .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        .password-wrapper { position: relative; }
        .password-wrapper .field { padding-right: 46px; }

        .toggle-password {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
        }

        .toggle-password:hover { color: var(--accent); }

        .login-btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-btn:hover { background: var(--accent-hover); }

        .credentials-box {
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 13px 15px;
            font-size: 13px;
            margin-top: 22px;
        }

        .credentials-box .title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .credentials-box .row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .credentials-box .row strong {
            font-family: var(--font-mono);
            color: var(--text);
        }
    </style>
</head>


<body>

<button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

<div class="login-card">

    <div class="login-header">
        <div class="login-mark">🛒</div>
        <h1>Billing POS</h1>
        <p>Login to your account</p>
    </div>

    <div class="login-body">

        {% if error %}
        <div class="alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field-group">
                <label for="username" class="field-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="field"
                    placeholder="Enter username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="field-group">
                <label for="password" class="field-label">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="field"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">🔐 Login</button>

        </form>
    </div>
</div>


<!-- =====================================================
     THEME TOGGLE
===================================================== -->
<script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('pos-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('pos-theme', next);
        applyTheme(next);
    });
</script>

<!-- =====================================================
     PASSWORD VISIBILITY TOGGLE (unchanged logic from original file)
===================================================== -->
<script>

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type =
                "text";

            togglePassword.textContent =
                "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

            togglePassword.setAttribute(
                "title",
                "Hide password"
            );

        } else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "👁️";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

            togglePassword.setAttribute(
                "title",
                "Show password"
            );

        }

    }
);

</script>


</body>

</html>
