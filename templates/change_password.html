<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Billing POS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           DESIGN TOKENS (shared across all pages)
        ===================================================== */
        :root {
            --bg: #F5F6F3;
            --surface: #FFFFFF;
            --surface-sunken: #EFF1EC;
            --border: #E1E3DE;
            --text: #1A1D1B;
            --text-muted: #6B7268;

            --accent: #1F6F54;
            --accent-hover: #185B44;
            --accent-soft: #E4EFE9;
            --danger: #B3392C;
            --danger-soft: #F6E4E1;

            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            --radius: 8px;
            --shadow: 0 10px 30px rgba(20, 24, 20, 0.10);
        }

        [data-theme="dark"] {
            --bg: #12161A;
            --surface: #1B2127;
            --surface-sunken: #161B20;
            --border: #2A3138;
            --text: #E8EAE7;
            --text-muted: #8B948C;

            --accent: #2E8F6E;
            --accent-hover: #37A67F;
            --accent-soft: #16261F;
            --danger: #C4564A;
            --danger-soft: #2A1917;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        a { text-decoration: none; color: inherit; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface-sunken);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 30px;
        }

        .card h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px 0; }
        .card .sub { font-size: 13.5px; color: var(--text-muted); margin: 0 0 22px 0; }

        .alert {
            border-radius: var(--radius);
            padding: 11px 14px;
            font-size: 13.5px;
            margin-bottom: 18px;
        }

        .alert.error { background: var(--danger-soft); color: var(--danger); }
        .alert.success { background: var(--accent-soft); color: var(--accent); }

        .field-group { margin-bottom: 16px; }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field {
            width: 100%;
            padding: 12px 14px;
            font-size: 14.5px;
            font-family: var(--font-ui);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunken);
            color: var(--text);
        }

        .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            font-size: 14.5px;
            font-weight: 700;
            font-family: var(--font-ui);
            text-align: center;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn:hover { background: var(--accent-hover); }

        .btn-outline {
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover { background: var(--surface-sunken); border-color: var(--accent); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .back-link:hover { color: var(--accent); }
    </style>
</head>


<body>

<button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

<div class="card">

    <h1>🔐 Change Password</h1>
    <p class="sub">Signed in as <strong>{{ session.get("username", "Admin") }}</strong></p>

    {% if error %}
        <div class="alert error">{{ error }}</div>
    {% endif %}

    {% if success %}

        <div class="alert success">{{ success }}</div>

        <a href="/dashboard" class="btn">Back to Dashboard</a>
        <a href="/pos" class="btn btn-outline">Go to Point of Sale</a>

    {% else %}

        <form method="POST" action="/change_password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field-group">
                <label for="current_password" class="field-label">Current password</label>
                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    class="field"
                    required
                    autofocus
                    autocomplete="current-password"
                >
            </div>

            <div class="field-group">
                <label for="new_password" class="field-label">New password</label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="field"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
                <div class="hint">At least 8 characters. Avoid common passwords.</div>
            </div>

            <div class="field-group">
                <label for="confirm_password" class="field-label">Confirm new password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="field"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn">Update Password</button>

        </form>

        <a href="/dashboard" class="back-link">← Back to Dashboard</a>

    {% endif %}

</div>


<!-- =====================================================
     THEME TOGGLE
===================================================== -->
<script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('pos-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('pos-theme', next);
        applyTheme(next);
    });
</script>

</body>

</html>
