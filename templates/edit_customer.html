<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Customer - Billing POS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           DESIGN TOKENS (shared across all pages)
        ===================================================== */
        :root {
            --bg: #F5F6F3;
            --surface: #FFFFFF;
            --surface-sunken: #EFF1EC;
            --border: #E1E3DE;
            --text: #1A1D1B;
            --text-muted: #6B7268;
            --sidebar-bg: #14181A;
            --sidebar-text: #C7CCC7;
            --sidebar-text-active: #FFFFFF;

            --accent: #1F6F54;
            --accent-hover: #185B44;
            --accent-soft: #E4EFE9;
            --danger: #B3392C;
            --danger-soft: #F6E4E1;

            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

            --radius: 6px;
            --shadow: 0 1px 2px rgba(20, 24, 20, 0.06);
        }

        [data-theme="dark"] {
            --bg: #12161A;
            --surface: #1B2127;
            --surface-sunken: #161B20;
            --border: #2A3138;
            --text: #E8EAE7;
            --text-muted: #8B948C;
            --sidebar-bg: #0D1013;
            --sidebar-text: #8B948C;
            --sidebar-text-active: #FFFFFF;

            --accent: #2E8F6E;
            --accent-hover: #37A67F;
            --accent-soft: #16261F;
            --danger: #C4564A;
            --danger-soft: #2A1917;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text);
            transition: background 0.15s ease, color 0.15s ease;
        }

        a { text-decoration: none; color: inherit; }

        /* ---- Shell / sidebar / topbar (shared) ---- */
        .shell { display: flex; min-height: 100vh; }

        .sidebar {
            width: 232px;
            flex-shrink: 0;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 22px 16px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px 22px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 18px;
        }

        .brand-mark {
            width: 30px; height: 30px; border-radius: 7px;
            background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; flex-shrink: 0;
        }

        .brand-name { color: #fff; font-weight: 600; font-size: 14.5px; }

        .nav-group { display: flex; flex-direction: column; gap: 2px; }

        .nav-link {
            display: flex; align-items: center; gap: 11px;
            padding: 9px 10px; border-radius: var(--radius);
            color: var(--sidebar-text); font-size: 13.5px; font-weight: 500;
        }

        .nav-link .ic { font-size: 15px; width: 18px; text-align: center; }
        .nav-link:hover { background: rgba(255,255,255,0.05); color: var(--sidebar-text-active); }
        .nav-link.active { background: var(--accent); color: #fff; }

        .sidebar-footer {
            margin-top: auto; padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 11.5px; color: #565D57;
        }

        .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 30px; border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .topbar h1 { font-size: 19px; font-weight: 700; margin: 0 0 2px 0; }
        .topbar .subtitle { font-size: 13px; color: var(--text-muted); margin: 0; }
        .topbar-actions { display: flex; align-items: center; gap: 10px; }

        .theme-toggle {
            width: 34px; height: 34px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--surface-sunken);
            color: var(--text); display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 15px;
        }

        .btn-logout {
            font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius);
            background: transparent; border: 1px solid var(--danger); color: var(--danger); cursor: pointer;
        }
        .btn-logout:hover { background: var(--danger-soft); }

        .content {
            padding: 40px 30px 50px 30px;
            display: flex;
            justify-content: center;
        }

        /* =====================================================
           PAGE CONTENT
        ===================================================== */
        .panel {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .panel-head {
            padding: 20px 26px;
            border-bottom: 1px solid var(--border);
        }

        .panel-head h2 { font-size: 17px; font-weight: 700; margin: 0; }
        .panel-head p { font-size: 12.5px; color: var(--text-muted); margin: 3px 0 0 0; }

        .panel-body { padding: 26px; }

        .field-group { margin-bottom: 16px; }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .field {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: var(--font-ui);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-sunken);
            color: var(--text);
        }

        .field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

        .btn-primary {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 14.5px;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--accent);
        }

        .back-link:hover { text-decoration: underline; }

        @media (max-width: 720px) {
            .sidebar { display: none; }
            .content { padding: 26px 18px; }
        }
    </style>
</head>

<body>

<div class="shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">🛒</div>
            <div class="brand-name">Billing POS</div>
        </div>

        <nav class="nav-group">
            <a href="/dashboard" class="nav-link"><span class="ic">🏠</span> Dashboard</a>
            <a href="/pos" class="nav-link"><span class="ic">🛒</span> Point of Sale</a>
            <a href="/invoices" class="nav-link"><span class="ic">🧾</span> Invoices</a>
            <a href="/customers" class="nav-link active"><span class="ic">👥</span> Customers</a>
            <a href="/reports" class="nav-link"><span class="ic">📊</span> Reports</a>
            <a href="/" class="nav-link"><span class="ic">📦</span> Products</a>
        </nav>

        <div class="sidebar-footer">Billing POS · Store Console</div>
    </aside>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <div>
                <h1>Edit Customer</h1>
                <p class="subtitle">Update customer details</p>
            </div>

            <div class="topbar-actions">
                <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
                <a href="/logout" class="btn-logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a>
            </div>
        </div>

        <div class="content">

            <div class="panel">
                <div class="panel-head">
                    <h2>Edit Customer</h2>
                    <p>Changes apply immediately to this customer's record</p>
                </div>

                <div class="panel-body">

                    <form action="/edit_customer/{{ customer.id }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="field-group">
                            <label class="field-label">Customer Name</label>
                            <input type="text" name="name" class="field" value="{{ customer.name }}" required>
                        </div>

                        <div class="field-group">
                            <label class="field-label">Phone Number</label>
                            <input type="text" name="phone" class="field" value="{{ customer.phone or '' }}">
                        </div>

                        <div class="field-group">
                            <label class="field-label">Email</label>
                            <input type="email" name="email" class="field" value="{{ customer.email or '' }}">
                        </div>

                        <div class="field-group">
                            <label class="field-label">Address</label>
                            <input type="text" name="address" class="field" value="{{ customer.address or '' }}">
                        </div>

                        <button type="submit" class="btn-primary">Update Customer</button>

                    </form>

                    <a href="/customers" class="back-link">← Back to Customers</a>

                </div>
            </div>

        </div>
    </div>
</div>


<!-- =====================================================
     THEME TOGGLE
===================================================== -->
<script>
    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('pos-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', function () {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('pos-theme', next);
        applyTheme(next);
    });
</script>

</body>

</html>
